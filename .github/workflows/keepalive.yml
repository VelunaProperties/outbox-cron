# GitHub deaktiviert Schedule-Workflows nach 60 Tagen ohne Commit. Dieser wöchentliche
# Leer-Commit hält den Outbox-Ping dauerhaft am Laufen.
name: Keepalive
on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Leer-Commit pushen
        run: |
          git config user.name "keepalive"
          git config user.email "actions@users.noreply.github.com"
          git commit --allow-empty -m "Keepalive: Schedule aktiv halten"
          git push
